<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard - Store System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar p-3">
        <div class="d-flex align-items-center mb-3">
          <div class="fw-bold">Store System</div>
        </div>
        <nav class="nav nav-pills flex-column gap-1">
          <a class="nav-link" data-nav href="dashboard.html">Dashboard</a>
          <a class="nav-link" data-nav href="categories.html">Categories</a>
          <a class="nav-link" data-nav href="products.html">Products</a>
          <a class="nav-link" data-nav href="variants.html">Variants</a>
          <a class="nav-link" data-nav href="inventory.html">Inventory</a>
          <a class="nav-link" data-nav href="sales.html">Sales POS</a>
          <a class="nav-link" data-nav href="reports.html">Reports</a>
          <a class="nav-link" data-nav href="settings.html">Settings</a>
        </nav>
        <hr class="border-secondary my-3" />
        <button id="logoutBtn" class="btn btn-outline-light btn-sm w-100">Logout</button>
        <div class="text-muted small mt-2" id="who"></div>
      </aside>

      <main class="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="mb-0">Dashboard</h3>
          <div class="text-muted small">Low stock threshold: <b>5</b></div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-3">
            <div class="card card-kpi shadow-sm">
              <div class="card-body">
                <div class="text-muted small">Total Products</div>
                <div class="fs-3 fw-bold" id="kpiProducts">-</div>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card card-kpi shadow-sm">
              <div class="card-body">
                <div class="text-muted small">Total Variants</div>
                <div class="fs-3 fw-bold" id="kpiVariants">-</div>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card card-kpi shadow-sm">
              <div class="card-body">
                <div class="text-muted small">Today’s Sales</div>
                <div class="fs-3 fw-bold">₱ <span id="kpiToday">-</span></div>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card card-kpi shadow-sm">
              <div class="card-body">
                <div class="text-muted small">Monthly Revenue</div>
                <div class="fs-3 fw-bold">₱ <span id="kpiMonth">-</span></div>
              </div>
            </div>
          </div>
        </div>

        <div class="row g-3">
          <div class="col-lg-6">
            <div class="card shadow-sm border-0 rounded-4">
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                  <h5 class="mb-0">Low Stock Items</h5>
                  <a href="inventory.html" class="small">View inventory</a>
                </div>
                <div class="table-responsive mt-3">
                  <table class="table table-sm align-middle">
                    <thead>
                      <tr>
                        <th>SKU</th>
                        <th>Product</th>
                        <th class="text-end">Stock</th>
                      </tr>
                    </thead>
                    <tbody id="lowStockBody"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="card shadow-sm border-0 rounded-4">
              <div class="card-body">
                <h5 class="mb-0">Recent Sales</h5>
                <div class="table-responsive mt-3">
                  <table class="table table-sm align-middle">
                    <thead>
                      <tr>
                        <th>ID</th>
                        <th>Date</th>
                        <th>Method</th>
                        <th class="text-end">Total</th>
                      </tr>
                    </thead>
                    <tbody id="recentSalesBody"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
      (async () => {
        setActiveNav();
        const user = await requireSession();
        if (!user) return;
        document.getElementById("who").textContent = `Logged in as ${user.username}`;

        document.getElementById("logoutBtn").addEventListener("click", async () => {
          await apiFetch("/api/auth/logout", { method: "POST" });
          location.href = "index.html";
        });

        const d = await apiFetch("/api/dashboard");
        document.getElementById("kpiProducts").textContent = d.totals.products;
        document.getElementById("kpiVariants").textContent = d.totals.variants;
        document.getElementById("kpiToday").textContent = money(d.totals.todays_sales);
        document.getElementById("kpiMonth").textContent = money(d.totals.monthly_revenue);

        const lowBody = document.getElementById("lowStockBody");
        lowBody.innerHTML = d.low_stock.length
          ? d.low_stock
              .map(
                (x) => `
              <tr class="${Number(x.stock) <= 5 ? "low-stock" : ""}">
                <td>${x.sku}</td>
                <td>${x.product_name}</td>
                <td class="text-end fw-bold">${x.stock}</td>
              </tr>`
              )
              .join("")
          : `<tr><td colspan="3" class="text-muted">No low stock items.</td></tr>`;

        const rsBody = document.getElementById("recentSalesBody");
        rsBody.innerHTML = d.recent_sales.length
          ? d.recent_sales
              .map(
                (s) => `
              <tr>
                <td>#${s.id}</td>
                <td>${new Date(s.sale_date).toLocaleString()}</td>
                <td>${s.payment_method}</td>
                <td class="text-end">₱ ${money(s.total)}</td>
              </tr>`
              )
              .join("")
          : `<tr><td colspan="4" class="text-muted">No sales yet.</td></tr>`;
      })().catch((e) => {
        console.error(e);
        toast(e.message || "Failed to load dashboard", "danger");
      });
    </script>
  </body>
</html>
