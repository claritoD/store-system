<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Store System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">
              <h4 class="mb-1">Store System</h4>
              <p class="text-muted mb-4">Sign in to continue</p>

              <form id="loginForm">
                <div class="mb-3">
                  <label class="form-label">Username</label>
                  <input class="form-control" name="username" autocomplete="username" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input class="form-control" type="password" name="password" autocomplete="current-password" required />
                </div>
                <button class="btn btn-primary w-100" type="submit">Login</button>
              </form>

              <div class="small text-muted mt-3">
                Default seed: <b>admin</b> / <b>admin12345</b>
              </div>

              <div id="err" class="alert alert-danger d-none mt-3 mb-0"></div>
            </div>
          </div>
          <div class="text-center text-muted small mt-3">
            API: <span id="apiBase"></span>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
      document.getElementById("apiBase").textContent = (window.API_BASE_URL || "").replace(/\/$/, "");

      async function alreadyLoggedIn() {
        try {
          await apiFetch("/api/auth/me");
          location.href = "dashboard.html";
        } catch (_) {}
      }
      alreadyLoggedIn();

      const form = document.getElementById("loginForm");
      const err = document.getElementById("err");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        err.classList.add("d-none");
        const fd = new FormData(form);
        const body = { username: fd.get("username"), password: fd.get("password") };
        try {
          await apiFetch("/api/auth/login", { method: "POST", body });
          location.href = "dashboard.html";
        } catch (ex) {
          err.textContent = ex.message || "Login failed";
          err.classList.remove("d-none");
        }
      });
    </script>
  </body>
</html>
