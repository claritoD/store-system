<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Categories - Store System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar p-3">
        <div class="fw-bold mb-3">Store System</div>
        <nav class="nav nav-pills flex-column gap-1">
          <a class="nav-link" data-nav href="dashboard.html">Dashboard</a>
          <a class="nav-link" data-nav href="categories.html">Categories</a>
          <a class="nav-link" data-nav href="products.html">Products</a>
          <a class="nav-link" data-nav href="variants.html">Variants</a>
          <a class="nav-link" data-nav href="inventory.html">Inventory</a>
          <a class="nav-link" data-nav href="sales.html">Sales POS</a>
          <a class="nav-link" data-nav href="reports.html">Reports</a>
          <a class="nav-link" data-nav href="settings.html">Settings</a>
        </nav>
        <hr class="border-secondary my-3" />
        <button id="logoutBtn" class="btn btn-outline-light btn-sm w-100">Logout</button>
      </aside>

      <main class="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="mb-0">Categories</h3>
          <button class="btn btn-primary" id="addBtn">Add Category</button>
        </div>

        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-sm align-middle">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="modal fade" id="modal" tabindex="-1">
      <div class="modal-dialog">
        <form class="modal-content" id="form">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Category</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" name="id" />
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input class="form-control" name="name" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" name="description" rows="3"></textarea>
            </div>
            <div id="err" class="alert alert-danger d-none mb-0"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
      let modal;
      let categories = [];

      function render() {
        const body = document.getElementById("body");
        body.innerHTML = categories.length
          ? categories
              .map(
                (c) => `
              <tr>
                <td class="fw-semibold">${c.name}</td>
                <td class="text-muted">${c.description || ""}</td>
                <td class="text-end">
                  <button class="btn btn-sm btn-outline-primary me-2" data-edit="${c.id}">Edit</button>
                  <button class="btn btn-sm btn-outline-danger" data-del="${c.id}">Delete</button>
                </td>
              </tr>`
              )
              .join("")
          : `<tr><td colspan="3" class="text-muted">No categories yet.</td></tr>`;
      }

      async function load() {
        const r = await apiFetch("/api/categories");
        categories = r.categories;
        render();
      }

      function openModal(cat) {
        const f = document.getElementById("form");
        f.reset();
        document.getElementById("err").classList.add("d-none");
        f.id.value = cat ? cat.id : "";
        f.name.value = cat ? cat.name : "";
        f.description.value = cat ? cat.description || "" : "";
        document.getElementById("modalTitle").textContent = cat ? "Edit Category" : "Add Category";
        modal.show();
      }

      (async () => {
        setActiveNav();
        await requireSession();

        document.getElementById("logoutBtn").addEventListener("click", async () => {
          await apiFetch("/api/auth/logout", { method: "POST" });
          location.href = "login.html";
        });

        modal = new bootstrap.Modal(document.getElementById("modal"));
        document.getElementById("addBtn").addEventListener("click", () => openModal(null));

        document.getElementById("body").addEventListener("click", async (e) => {
          const editId = e.target.getAttribute("data-edit");
          const delId = e.target.getAttribute("data-del");
          if (editId) openModal(categories.find((x) => String(x.id) === String(editId)));
          if (delId) {
            if (!confirm("Delete this category?")) return;
            await apiFetch(`/api/categories/${delId}`, { method: "DELETE" });
            toast("Category deleted", "success");
            await load();
          }
        });

        document.getElementById("form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const f = e.target;
          const payload = { name: f.name.value, description: f.description.value };
          try {
            if (f.id.value) {
              await apiFetch(`/api/categories/${f.id.value}`, { method: "PUT", body: payload });
              toast("Category updated", "success");
            } else {
              await apiFetch("/api/categories", { method: "POST", body: payload });
              toast("Category created", "success");
            }
            modal.hide();
            await load();
          } catch (ex) {
            const err = document.getElementById("err");
            err.textContent = ex.message || "Save failed";
            err.classList.remove("d-none");
          }
        });

        await load();
      })().catch((e) => {
        console.error(e);
        toast(e.message || "Failed to load", "danger");
      });
    </script>
  </body>
</html>
