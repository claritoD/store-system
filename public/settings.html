<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings - Store System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar p-3">
        <div class="fw-bold mb-3">Store System</div>
        <nav class="nav nav-pills flex-column gap-1">
          <a class="nav-link" data-nav href="dashboard.html">Dashboard</a>
          <a class="nav-link" data-nav href="categories.html">Categories</a>
          <a class="nav-link" data-nav href="products.html">Products</a>
          <a class="nav-link" data-nav href="variants.html">Variants</a>
          <a class="nav-link" data-nav href="inventory.html">Inventory</a>
          <a class="nav-link" data-nav href="sales.html">Sales POS</a>
          <a class="nav-link" data-nav href="reports.html">Reports</a>
          <a class="nav-link" data-nav href="settings.html">Settings</a>
        </nav>
        <hr class="border-secondary my-3" />
        <button id="logoutBtn" class="btn btn-outline-light btn-sm w-100">Logout</button>
      </aside>

      <main class="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="mb-0">Settings</h3>
        </div>

        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body">
            <form id="form" class="row g-3" style="max-width: 900px">
              <div class="col-md-6">
                <label class="form-label">Store Name</label>
                <input class="form-control" name="store_name" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input class="form-control" name="phone" />
              </div>
              <div class="col-12">
                <label class="form-label">Address</label>
                <input class="form-control" name="address" />
              </div>
              <div class="col-12">
                <button class="btn btn-primary" type="submit">Save Settings</button>
              </div>
              <div id="err" class="alert alert-danger d-none mb-0"></div>
            </form>
            <div class="text-muted small mt-3">
              These details are used on the printed receipt.
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
      async function loadSettings() {
        const r = await apiFetch("/api/settings");
        const s = r.settings || { store_name: "My Store", address: "", phone: "" };
        const f = document.getElementById("form");
        f.store_name.value = s.store_name || "";
        f.address.value = s.address || "";
        f.phone.value = s.phone || "";
      }

      (async () => {
        setActiveNav();
        await requireSession();

        document.getElementById("logoutBtn").addEventListener("click", async () => {
          await apiFetch("/api/auth/logout", { method: "POST" });
          location.href = "index.html";
        });

        await loadSettings();

        document.getElementById("form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const err = document.getElementById("err");
          err.classList.add("d-none");
          try {
            const f = e.target;
            await apiFetch("/api/settings", {
              method: "PUT",
              body: {
                store_name: f.store_name.value,
                address: f.address.value,
                phone: f.phone.value
              }
            });
            toast("Settings saved", "success");
          } catch (ex) {
            err.textContent = ex.message || "Failed to save";
            err.classList.remove("d-none");
          }
        });
      })().catch((e) => {
        console.error(e);
        toast(e.message || "Failed to load", "danger");
      });
    </script>
  </body>
</html>
