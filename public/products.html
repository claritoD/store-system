<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products - Store System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar p-3">
        <div class="fw-bold mb-3">Store System</div>
        <nav class="nav nav-pills flex-column gap-1">
          <a class="nav-link" data-nav href="dashboard.html">Dashboard</a>
          <a class="nav-link" data-nav href="categories.html">Categories</a>
          <a class="nav-link" data-nav href="products.html">Products</a>
          <a class="nav-link" data-nav href="variants.html">Variants</a>
          <a class="nav-link" data-nav href="inventory.html">Inventory</a>
          <a class="nav-link" data-nav href="sales.html">Sales POS</a>
          <a class="nav-link" data-nav href="reports.html">Reports</a>
          <a class="nav-link" data-nav href="settings.html">Settings</a>
        </nav>
        <hr class="border-secondary my-3" />
        <button id="logoutBtn" class="btn btn-outline-light btn-sm w-100">Logout</button>
      </aside>

      <main class="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="mb-0">Products</h3>
          <button class="btn btn-primary" id="addBtn">Add Product</button>
        </div>

        <div class="card shadow-sm border-0 rounded-4 mb-3">
          <div class="card-body">
            <div class="row g-2 align-items-end">
              <div class="col-md-6">
                <label class="form-label">Search</label>
                <input id="q" class="form-control" placeholder="Search by product name..." />
              </div>
              <div class="col-md-4">
                <label class="form-label">Category</label>
                <select id="cat" class="form-select">
                  <option value="">All</option>
                </select>
              </div>
              <div class="col-md-2 d-grid">
                <button id="searchBtn" class="btn btn-outline-primary">Search</button>
              </div>
            </div>
          </div>
        </div>

        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-sm align-middle">
                <thead>
                  <tr>
                    <th>Product</th>
                    <th>Category</th>
                    <th>Brand</th>
                    <th>Image</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="modal fade" id="modal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <form class="modal-content" id="form">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Product</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" name="id" />
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Name</label>
                <input class="form-control" name="name" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Category</label>
                <select class="form-select" name="category_id">
                  <option value="">(none)</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Brand</label>
                <input class="form-control" name="brand" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Image (upload)</label>
                <input class="form-control" type="file" name="image" accept="image/*" />
                <div class="form-text">Uses Cloudinary (configured on backend).</div>
              </div>
              <div class="col-12">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="description" rows="3"></textarea>
              </div>
            </div>
            <div id="err" class="alert alert-danger d-none mt-3 mb-0"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
      let modal;
      let categories = [];
      let products = [];

      function fillCategories(select, includeAll = false) {
        const options = [];
        if (includeAll) options.push(`<option value="">All</option>`);
        else options.push(`<option value="">(none)</option>`);
        for (const c of categories) options.push(`<option value="${c.id}">${c.name}</option>`);
        select.innerHTML = options.join("");
      }

      function render() {
        const body = document.getElementById("body");
        body.innerHTML = products.length
          ? products
              .map(
                (p) => `
              <tr>
                <td class="fw-semibold">${p.name}</td>
                <td class="text-muted">${p.category_name || ""}</td>
                <td class="text-muted">${p.brand || ""}</td>
                <td>${p.image_url ? `<a class="small" href="${p.image_url}" target="_blank">view</a>` : `<span class="text-muted small">none</span>`}</td>
                <td class="text-end">
                  <button class="btn btn-sm btn-outline-primary me-2" data-edit="${p.id}">Edit</button>
                  <button class="btn btn-sm btn-outline-danger" data-del="${p.id}">Delete</button>
                </td>
              </tr>`
              )
              .join("")
          : `<tr><td colspan="5" class="text-muted">No products found.</td></tr>`;
      }

      async function loadCategories() {
        const r = await apiFetch("/api/categories");
        categories = r.categories;
        fillCategories(document.getElementById("cat"), true);
        fillCategories(document.querySelector('#form select[name="category_id"]'), false);
      }

      async function loadProducts() {
        const q = document.getElementById("q").value.trim();
        const cat = document.getElementById("cat").value;
        const params = new URLSearchParams();
        if (q) params.set("q", q);
        if (cat) params.set("category_id", cat);
        const r = await apiFetch("/api/products" + (params.toString() ? `?${params}` : ""));
        products = r.products;
        render();
      }

      function openModal(p) {
        const f = document.getElementById("form");
        f.reset();
        document.getElementById("err").classList.add("d-none");
        f.id.value = p ? p.id : "";
        f.name.value = p ? p.name : "";
        f.category_id.value = p && p.category_id ? p.category_id : "";
        f.brand.value = p ? p.brand || "" : "";
        f.description.value = p ? p.description || "" : "";
        document.getElementById("modalTitle").textContent = p ? "Edit Product" : "Add Product";
        modal.show();
      }

      (async () => {
        setActiveNav();
        await requireSession();

        document.getElementById("logoutBtn").addEventListener("click", async () => {
          await apiFetch("/api/auth/logout", { method: "POST" });
          location.href = "login.html";
        });

        modal = new bootstrap.Modal(document.getElementById("modal"));
        document.getElementById("addBtn").addEventListener("click", () => openModal(null));
        document.getElementById("searchBtn").addEventListener("click", loadProducts);

        document.getElementById("body").addEventListener("click", async (e) => {
          const editId = e.target.getAttribute("data-edit");
          const delId = e.target.getAttribute("data-del");
          if (editId) openModal(products.find((x) => String(x.id) === String(editId)));
          if (delId) {
            if (!confirm("Delete this product? Variants will also be deleted.")) return;
            await apiFetch(`/api/products/${delId}`, { method: "DELETE" });
            toast("Product deleted", "success");
            await loadProducts();
          }
        });

        document.getElementById("form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const f = e.target;
          const fd = new FormData();
          fd.append("name", f.name.value);
          if (f.category_id.value) fd.append("category_id", f.category_id.value);
          fd.append("brand", f.brand.value || "");
          fd.append("description", f.description.value || "");
          if (f.image.files && f.image.files[0]) fd.append("image", f.image.files[0]);
          try {
            if (f.id.value) {
              await apiFetch(`/api/products/${f.id.value}`, { method: "PUT", body: fd });
              toast("Product updated", "success");
            } else {
              await apiFetch("/api/products", { method: "POST", body: fd });
              toast("Product created", "success");
            }
            modal.hide();
            await loadProducts();
          } catch (ex) {
            const err = document.getElementById("err");
            err.textContent = ex.message || "Save failed";
            err.classList.remove("d-none");
          }
        });

        await loadCategories();
        await loadProducts();
      })().catch((e) => {
        console.error(e);
        toast(e.message || "Failed to load", "danger");
      });
    </script>
  </body>
</html>
