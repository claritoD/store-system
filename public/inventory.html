<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inventory - Store System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar p-3">
        <div class="fw-bold mb-3">Store System</div>
        <nav class="nav nav-pills flex-column gap-1">
          <a class="nav-link" data-nav href="dashboard.html">Dashboard</a>
          <a class="nav-link" data-nav href="categories.html">Categories</a>
          <a class="nav-link" data-nav href="products.html">Products</a>
          <a class="nav-link" data-nav href="variants.html">Variants</a>
          <a class="nav-link" data-nav href="inventory.html">Inventory</a>
          <a class="nav-link" data-nav href="sales.html">Sales POS</a>
          <a class="nav-link" data-nav href="reports.html">Reports</a>
          <a class="nav-link" data-nav href="settings.html">Settings</a>
        </nav>
        <hr class="border-secondary my-3" />
        <button id="logoutBtn" class="btn btn-outline-light btn-sm w-100">Logout</button>
      </aside>

      <main class="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="mb-0">Inventory</h3>
          <a href="variants.html" class="btn btn-outline-primary">Manage Variants</a>
        </div>

        <div class="card shadow-sm border-0 rounded-4 mb-3">
          <div class="card-body">
            <div class="row g-2 align-items-end">
              <div class="col-md-6">
                <label class="form-label">Search (SKU or Product)</label>
                <input id="q" class="form-control" placeholder="Search..." />
              </div>
              <div class="col-md-2 d-grid">
                <button id="searchBtn" class="btn btn-outline-primary">Search</button>
              </div>
              <div class="col-md-4 text-muted small">
                Low stock highlighted when stock ≤ <b>5</b>.
              </div>
            </div>
          </div>
        </div>

        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-sm align-middle">
                <thead>
                  <tr>
                    <th>SKU</th>
                    <th>Product</th>
                    <th>Variant</th>
                    <th class="text-end">Price</th>
                    <th class="text-end">Stock</th>
                  </tr>
                </thead>
                <tbody id="body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
      let variants = [];

      function fmtVariant(v) {
        const parts = [];
        if (v.size) parts.push(`Size: ${v.size}`);
        if (v.color) parts.push(`Color: ${v.color}`);
        if (v.extra_attribute) parts.push(v.extra_attribute);
        return parts.join(" · ");
      }

      function render() {
        const body = document.getElementById("body");
        body.innerHTML = variants.length
          ? variants
              .map(
                (v) => `
              <tr class="${Number(v.stock) <= 5 ? "low-stock" : ""}">
                <td class="fw-semibold">${v.sku}</td>
                <td>${v.product_name}</td>
                <td class="text-muted">${fmtVariant(v)}</td>
                <td class="text-end">₱ ${money(v.price)}</td>
                <td class="text-end fw-bold">${v.stock}</td>
              </tr>`
              )
              .join("")
          : `<tr><td colspan="5" class="text-muted">No items found.</td></tr>`;
      }

      async function load() {
        const q = document.getElementById("q").value.trim();
        const params = new URLSearchParams();
        if (q) params.set("q", q);
        const r = await apiFetch("/api/variants" + (params.toString() ? `?${params}` : ""));
        variants = r.variants;
        render();
      }

      (async () => {
        setActiveNav();
        await requireSession();
        document.getElementById("logoutBtn").addEventListener("click", async () => {
          await apiFetch("/api/auth/logout", { method: "POST" });
          location.href = "login.html";
        });
        document.getElementById("searchBtn").addEventListener("click", load);
        await load();
      })().catch((e) => {
        console.error(e);
        toast(e.message || "Failed to load", "danger");
      });
    </script>
  </body>
</html>
