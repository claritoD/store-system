<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Variants - Store System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar p-3">
        <div class="fw-bold mb-3">Store System</div>
        <nav class="nav nav-pills flex-column gap-1">
          <a class="nav-link" data-nav href="dashboard.html">Dashboard</a>
          <a class="nav-link" data-nav href="categories.html">Categories</a>
          <a class="nav-link" data-nav href="products.html">Products</a>
          <a class="nav-link" data-nav href="variants.html">Variants</a>
          <a class="nav-link" data-nav href="inventory.html">Inventory</a>
          <a class="nav-link" data-nav href="sales.html">Sales POS</a>
          <a class="nav-link" data-nav href="reports.html">Reports</a>
          <a class="nav-link" data-nav href="settings.html">Settings</a>
        </nav>
        <hr class="border-secondary my-3" />
        <button id="logoutBtn" class="btn btn-outline-light btn-sm w-100">Logout</button>
      </aside>

      <main class="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="mb-0">Variants</h3>
          <button class="btn btn-primary" id="addBtn">Add Variant</button>
        </div>

        <div class="card shadow-sm border-0 rounded-4 mb-3">
          <div class="card-body">
            <div class="row g-2 align-items-end">
              <div class="col-md-6">
                <label class="form-label">Search (SKU or Product)</label>
                <input id="q" class="form-control" placeholder="e.g. SKU-1 or T-Shirt" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Product</label>
                <select id="product" class="form-select">
                  <option value="">All</option>
                </select>
              </div>
              <div class="col-md-2 d-grid">
                <button id="searchBtn" class="btn btn-outline-primary">Search</button>
              </div>
            </div>
          </div>
        </div>

        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-sm align-middle">
                <thead>
                  <tr>
                    <th>SKU</th>
                    <th>Product</th>
                    <th>Size</th>
                    <th>Color</th>
                    <th>Extra</th>
                    <th class="text-end">Price</th>
                    <th class="text-end">Stock</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="modal fade" id="modal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <form class="modal-content" id="form">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Variant</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" name="id" />
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Product</label>
                <select class="form-select" name="product_id" required></select>
              </div>
              <div class="col-md-6">
                <label class="form-label">SKU</label>
                <input class="form-control" name="sku" required />
              </div>
              <div class="col-md-4">
                <label class="form-label">Size</label>
                <input class="form-control" name="size" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Color</label>
                <input class="form-control" name="color" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Extra Attribute</label>
                <input class="form-control" name="extra_attribute" placeholder="e.g. Flavor: Mango" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Price</label>
                <input class="form-control" name="price" type="number" step="0.01" min="0" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Stock</label>
                <input class="form-control" name="stock" type="number" step="1" min="0" required />
              </div>
            </div>
            <div id="err" class="alert alert-danger d-none mt-3 mb-0"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
      let modal;
      let products = [];
      let variants = [];

      function fillProducts(select, includeAll = false) {
        const opts = [];
        if (includeAll) opts.push(`<option value="">All</option>`);
        else opts.push(`<option value="">Select...</option>`);
        for (const p of products) opts.push(`<option value="${p.id}">${p.name}</option>`);
        select.innerHTML = opts.join("");
      }

      function render() {
        const body = document.getElementById("body");
        body.innerHTML = variants.length
          ? variants
              .map(
                (v) => `
              <tr class="${Number(v.stock) <= 5 ? "low-stock" : ""}">
                <td class="fw-semibold">${v.sku}</td>
                <td>${v.product_name}</td>
                <td class="text-muted">${v.size || ""}</td>
                <td class="text-muted">${v.color || ""}</td>
                <td class="text-muted">${v.extra_attribute || ""}</td>
                <td class="text-end">₱ ${money(v.price)}</td>
                <td class="text-end fw-bold">${v.stock}</td>
                <td class="text-end">
                  <button class="btn btn-sm btn-outline-primary me-2" data-edit="${v.id}">Edit</button>
                  <button class="btn btn-sm btn-outline-danger" data-del="${v.id}">Delete</button>
                </td>
              </tr>`
              )
              .join("")
          : `<tr><td colspan="8" class="text-muted">No variants found.</td></tr>`;
      }

      async function loadProducts() {
        const r = await apiFetch("/api/products");
        products = r.products.map((p) => ({ id: p.id, name: p.name }));
        fillProducts(document.getElementById("product"), true);
        fillProducts(document.querySelector('#form select[name="product_id"]'), false);
      }

      async function loadVariants() {
        const q = document.getElementById("q").value.trim();
        const product = document.getElementById("product").value;
        const params = new URLSearchParams();
        if (q) params.set("q", q);
        if (product) params.set("product_id", product);
        const r = await apiFetch("/api/variants" + (params.toString() ? `?${params}` : ""));
        variants = r.variants;
        render();
      }

      function openModal(v) {
        const f = document.getElementById("form");
        f.reset();
        document.getElementById("err").classList.add("d-none");
        f.id.value = v ? v.id : "";
        f.product_id.value = v ? v.product_id : "";
        f.sku.value = v ? v.sku : "";
        f.size.value = v ? v.size || "" : "";
        f.color.value = v ? v.color || "" : "";
        f.extra_attribute.value = v ? v.extra_attribute || "" : "";
        f.price.value = v ? v.price : "0";
        f.stock.value = v ? v.stock : "0";
        document.getElementById("modalTitle").textContent = v ? "Edit Variant" : "Add Variant";
        modal.show();
      }

      (async () => {
        setActiveNav();
        await requireSession();
        document.getElementById("logoutBtn").addEventListener("click", async () => {
          await apiFetch("/api/auth/logout", { method: "POST" });
          location.href = "index.html";
        });

        modal = new bootstrap.Modal(document.getElementById("modal"));
        document.getElementById("addBtn").addEventListener("click", () => openModal(null));
        document.getElementById("searchBtn").addEventListener("click", loadVariants);

        document.getElementById("body").addEventListener("click", async (e) => {
          const editId = e.target.getAttribute("data-edit");
          const delId = e.target.getAttribute("data-del");
          if (editId) openModal(variants.find((x) => String(x.id) === String(editId)));
          if (delId) {
            if (!confirm("Delete this variant?")) return;
            await apiFetch(`/api/variants/${delId}`, { method: "DELETE" });
            toast("Variant deleted", "success");
            await loadVariants();
          }
        });

        document.getElementById("form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const f = e.target;
          const payload = {
            product_id: f.product_id.value,
            sku: f.sku.value,
            size: f.size.value,
            color: f.color.value,
            extra_attribute: f.extra_attribute.value,
            price: f.price.value,
            stock: f.stock.value
          };
          try {
            if (f.id.value) {
              await apiFetch(`/api/variants/${f.id.value}`, { method: "PUT", body: payload });
              toast("Variant updated", "success");
            } else {
              await apiFetch("/api/variants", { method: "POST", body: payload });
              toast("Variant created", "success");
            }
            modal.hide();
            await loadVariants();
          } catch (ex) {
            const err = document.getElementById("err");
            err.textContent = ex.message || "Save failed";
            err.classList.remove("d-none");
          }
        });

        await loadProducts();
        await loadVariants();
      })().catch((e) => {
        console.error(e);
        toast(e.message || "Failed to load", "danger");
      });
    </script>
  </body>
</html>
