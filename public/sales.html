<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sales POS - Store System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
    <style>
      @media print {
        body * {
          visibility: hidden;
        }
        #receiptPrint,
        #receiptPrint * {
          visibility: visible;
        }
        #receiptPrint {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          padding: 12px;
          background: white;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar p-3">
        <div class="fw-bold mb-3">Store System</div>
        <nav class="nav nav-pills flex-column gap-1">
          <a class="nav-link" data-nav href="dashboard.html">Dashboard</a>
          <a class="nav-link" data-nav href="categories.html">Categories</a>
          <a class="nav-link" data-nav href="products.html">Products</a>
          <a class="nav-link" data-nav href="variants.html">Variants</a>
          <a class="nav-link" data-nav href="inventory.html">Inventory</a>
          <a class="nav-link" data-nav href="sales.html">Sales POS</a>
          <a class="nav-link" data-nav href="reports.html">Reports</a>
          <a class="nav-link" data-nav href="settings.html">Settings</a>
        </nav>
        <hr class="border-secondary my-3" />
        <button id="logoutBtn" class="btn btn-outline-light btn-sm w-100">Logout</button>
      </aside>

      <main class="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="mb-0">Sales POS</h3>
          <div class="text-muted small">Per piece only</div>
        </div>

        <div class="row g-3">
          <div class="col-lg-7">
            <div class="card shadow-sm border-0 rounded-4 mb-3">
              <div class="card-body">
                <label class="form-label">Search Variant (SKU or Product)</label>
                <div class="input-group">
                  <input id="q" class="form-control" placeholder="Search..." />
                  <button id="searchBtn" class="btn btn-outline-primary">Search</button>
                </div>
                <div class="table-responsive mt-3">
                  <table class="table table-sm align-middle">
                    <thead>
                      <tr>
                        <th>SKU</th>
                        <th>Product</th>
                        <th class="text-end">Price</th>
                        <th class="text-end">Stock</th>
                        <th class="text-end"></th>
                      </tr>
                    </thead>
                    <tbody id="searchBody"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

          <div class="col-lg-5">
            <div class="card shadow-sm border-0 rounded-4">
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                  <h5 class="mb-0">Cart</h5>
                  <button class="btn btn-sm btn-outline-danger" id="clearBtn">Clear</button>
                </div>
                <div class="table-responsive mt-3">
                  <table class="table table-sm align-middle">
                    <thead>
                      <tr>
                        <th>Item</th>
                        <th class="text-end">Qty</th>
                        <th class="text-end">Total</th>
                        <th></th>
                      </tr>
                    </thead>
                    <tbody id="cartBody"></tbody>
                  </table>
                </div>
                <hr />
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <div class="fw-bold">Grand Total</div>
                  <div class="fs-4 fw-bold">₱ <span id="grand">0.00</span></div>
                </div>
                <div class="mb-3">
                  <label class="form-label">Payment Method</label>
                  <select id="pay" class="form-select">
                    <option>Cash</option>
                    <option>GCash</option>
                    <option>Card</option>
                  </select>
                </div>
                <button id="checkoutBtn" class="btn btn-primary w-100">Checkout</button>
                <div id="err" class="alert alert-danger d-none mt-3 mb-0"></div>
              </div>
            </div>
          </div>
        </div>

        <div id="receiptPrint" class="d-none">
          <div class="text-center">
            <div class="fw-bold" id="rStore">My Store</div>
            <div class="small text-muted" id="rAddr"></div>
            <div class="small text-muted" id="rPhone"></div>
            <hr />
          </div>
          <div class="small">
            <div><b>Date:</b> <span id="rDate"></span></div>
            <div><b>Payment:</b> <span id="rPay"></span></div>
            <div><b>Sale #:</b> <span id="rId"></span></div>
          </div>
          <hr />
          <table class="table table-sm">
            <thead>
              <tr>
                <th>Item</th>
                <th class="text-end">Qty</th>
                <th class="text-end">Price</th>
                <th class="text-end">Total</th>
              </tr>
            </thead>
            <tbody id="rItems"></tbody>
          </table>
          <hr />
          <div class="d-flex justify-content-between fw-bold">
            <div>Total</div>
            <div>₱ <span id="rTotal"></span></div>
          </div>
          <div class="text-center small text-muted mt-3">Thank you!</div>
        </div>
      </main>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
      let searchResults = [];
      const cart = new Map(); // variant_id -> {variant, qty}

      function cartTotal() {
        let t = 0;
        for (const { variant, qty } of cart.values()) t += Number(variant.price) * qty;
        return Math.round(t * 100) / 100;
      }

      function renderSearch() {
        const body = document.getElementById("searchBody");
        body.innerHTML = searchResults.length
          ? searchResults
              .map(
                (v) => `
              <tr class="${Number(v.stock) <= 5 ? "low-stock" : ""}">
                <td class="fw-semibold">${v.sku}</td>
                <td>${v.product_name}</td>
                <td class="text-end">₱ ${money(v.price)}</td>
                <td class="text-end fw-bold">${v.stock}</td>
                <td class="text-end">
                  <button class="btn btn-sm btn-outline-primary" data-add="${v.id}">Add</button>
                </td>
              </tr>`
              )
              .join("")
          : `<tr><td colspan="5" class="text-muted">Search to add items.</td></tr>`;
      }

      function renderCart() {
        const body = document.getElementById("cartBody");
        const rows = Array.from(cart.values());
        body.innerHTML = rows.length
          ? rows
              .map(
                ({ variant, qty }) => `
              <tr>
                <td>
                  <div class="fw-semibold">${variant.product_name}</div>
                  <div class="small text-muted">${variant.sku}</div>
                </td>
                <td class="text-end">
                  <input class="form-control form-control-sm text-end" style="width:90px; display:inline-block"
                    type="number" min="1" step="1" value="${qty}" data-qty="${variant.id}">
                </td>
                <td class="text-end">₱ ${money(Number(variant.price) * qty)}</td>
                <td class="text-end">
                  <button class="btn btn-sm btn-outline-danger" data-rem="${variant.id}">×</button>
                </td>
              </tr>`
              )
              .join("")
          : `<tr><td colspan="4" class="text-muted">Cart is empty.</td></tr>`;
        document.getElementById("grand").textContent = money(cartTotal());
      }

      async function search() {
        const q = document.getElementById("q").value.trim();
        const params = new URLSearchParams();
        if (q) params.set("q", q);
        const r = await apiFetch("/api/variants" + (params.toString() ? `?${params}` : ""));
        searchResults = r.variants.slice(0, 50);
        renderSearch();
      }

      async function loadReceiptSettings() {
        try {
          const r = await apiFetch("/api/settings");
          const s = r.settings || { store_name: "My Store", address: "", phone: "" };
          document.getElementById("rStore").textContent = s.store_name || "My Store";
          document.getElementById("rAddr").textContent = s.address || "";
          document.getElementById("rPhone").textContent = s.phone || "";
        } catch (_) {}
      }

      function buildReceipt(sale, items) {
        document.getElementById("rDate").textContent = new Date(sale.sale_date).toLocaleString();
        document.getElementById("rPay").textContent = sale.payment_method;
        document.getElementById("rId").textContent = sale.id;
        document.getElementById("rTotal").textContent = money(sale.total);
        document.getElementById("rItems").innerHTML = items
          .map(
            (it) => `
          <tr>
            <td>
              <div class="fw-semibold">${it.product_name}</div>
              <div class="small text-muted">${it.sku}</div>
            </td>
            <td class="text-end">${it.quantity}</td>
            <td class="text-end">₱ ${money(it.price)}</td>
            <td class="text-end">₱ ${money(Number(it.price) * Number(it.quantity))}</td>
          </tr>`
          )
          .join("");
      }

      (async () => {
        setActiveNav();
        await requireSession();
        await loadReceiptSettings();

        document.getElementById("logoutBtn").addEventListener("click", async () => {
          await apiFetch("/api/auth/logout", { method: "POST" });
          location.href = "login.html";
        });

        document.getElementById("searchBtn").addEventListener("click", search);
        document.getElementById("q").addEventListener("keydown", (e) => {
          if (e.key === "Enter") search();
        });

        document.getElementById("searchBody").addEventListener("click", (e) => {
          const id = e.target.getAttribute("data-add");
          if (!id) return;
          const v = searchResults.find((x) => String(x.id) === String(id));
          if (!v) return;
          const existing = cart.get(String(v.id));
          const nextQty = existing ? existing.qty + 1 : 1;
          if (nextQty > Number(v.stock)) {
            toast("Insufficient stock", "warning");
            return;
          }
          cart.set(String(v.id), { variant: v, qty: nextQty });
          renderCart();
        });

        document.getElementById("cartBody").addEventListener("click", (e) => {
          const rem = e.target.getAttribute("data-rem");
          if (!rem) return;
          cart.delete(String(rem));
          renderCart();
        });

        document.getElementById("cartBody").addEventListener("change", (e) => {
          const id = e.target.getAttribute("data-qty");
          if (!id) return;
          const entry = cart.get(String(id));
          if (!entry) return;
          const qty = Math.max(1, Math.floor(Number(e.target.value || 1)));
          if (qty > Number(entry.variant.stock)) {
            toast("Insufficient stock", "warning");
            e.target.value = entry.qty;
            return;
          }
          entry.qty = qty;
          cart.set(String(id), entry);
          renderCart();
        });

        document.getElementById("clearBtn").addEventListener("click", () => {
          cart.clear();
          renderCart();
        });

        document.getElementById("checkoutBtn").addEventListener("click", async () => {
          const err = document.getElementById("err");
          err.classList.add("d-none");
          if (cart.size === 0) {
            toast("Cart is empty", "warning");
            return;
          }
          const items = Array.from(cart.values()).map(({ variant, qty }) => ({
            variant_id: variant.id,
            quantity: qty
          }));
          try {
            const r = await apiFetch("/api/sales", {
              method: "POST",
              body: { payment_method: document.getElementById("pay").value, items }
            });
            toast("Sale saved", "success");
            buildReceipt(r.sale, r.items);
            document.getElementById("receiptPrint").classList.remove("d-none");
            window.print();
            document.getElementById("receiptPrint").classList.add("d-none");
            cart.clear();
            renderCart();
            await search();
          } catch (ex) {
            err.textContent = ex.message || "Checkout failed";
            err.classList.remove("d-none");
          }
        });

        renderSearch();
        renderCart();
      })().catch((e) => {
        console.error(e);
        toast(e.message || "Failed to load", "danger");
      });
    </script>
  </body>
</html>
